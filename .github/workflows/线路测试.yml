name: 测试

on:
  workflow_dispatch:       # 允许手动触发
    inputs:
      private_branch:
        description: '私库分支'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PRIVATE_REPO: '360vip/ittv'
      PRIVATE_BRANCH: ${{ github.event.inputs.private_branch || 'main' }}

    steps:
      # ========== 1. 检出当前仓库 ==========
      - name: 检出当前仓库 📥
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ========== 2. Python 环境 ==========
      - name: 设置Python环境 🐍
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ========== 3. 安装依赖 ==========
      - name: 安装依赖 📦
        run: |
          python -m pip install --upgrade pip
          pip install requests idna

      # ========== 4. 从私库复制全部脚本和目录 ==========
      - name: 从私库复制全部文件 📦
        run: |
          set -e
          echo "开始克隆私有仓库 ${PRIVATE_REPO} (branch: ${PRIVATE_BRANCH}) ..."
          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/private-repo

          if [ ! -d "/tmp/private-repo/xltv" ]; then
            echo "错误: 私库中不存在 xltv 目录"
            exit 1
          fi

          echo "xltv 目录内容:"
          ls -la /tmp/private-repo/xltv

          cp -r /tmp/private-repo/xltv/. ${{ github.workspace }}/
          echo "xltv 全部文件已复制到工作目录"

          rm -rf /tmp/private-repo

      # ========== 执行脚本 ==========
      - name: 运行直播整理
        run: python ${{ github.workspace }}/py/zbzl.py

      # ========== 把运行结果推回私库 ==========
      - name: 推送 xltv 目录到私库 🚀
        run: |
          set -e

          # 无论成功失败都清理临时目录
          cleanup() { rm -rf /tmp/push-repo; }
          trap cleanup EXIT

          echo "开始推送到私有仓库 ${PRIVATE_REPO}/xltv (branch: ${PRIVATE_BRANCH}) ..."

          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/push-repo

          cd /tmp/push-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # 确保 xltv 目录存在（不清空整体，保留 py、gitdl 等未在清单中的目录）
          mkdir -p xltv

          # 需要复制的目录：本地存在就全新覆盖私库对应目录；
          # 私库原本没有该目录也没关系，cp 会自动创建
          COPY_ITEMS="okurl xl zhibo tv"

          for item in $COPY_ITEMS; do
            SRC="${{ github.workspace }}/$item"
            DST="xltv/$item"
            if [ -e "$SRC" ]; then
              rm -rf "$DST"        # 删除私库旧目录（不存在也无妨）
              cp -r "$SRC" "$DST"  # 全新复制（目标不存在会自动创建）
              echo "已复制 $item -> $DST"
            else
              echo "警告: $item 不存在，跳过（保留私库原内容）"
            fi
          done

          git add xltv/

          if git diff --cached --quiet; then
            echo "xltv 目录没有变更需要提交"
            exit 0
          fi

          git commit -m "自动更新 xltv 目录 - $(date '+%Y-%m-%d %H:%M:%S')"

          if ! git pull --rebase origin "${PRIVATE_BRANCH}"; then
            echo "错误: git pull --rebase 失败，可能有冲突，终止推送"
            exit 1
          fi

          if ! git push origin "${PRIVATE_BRANCH}"; then
            echo "错误: git push 失败"
            exit 1
          fi

          echo "xltv 目录已成功推送到私库"