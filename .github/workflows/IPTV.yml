name: 自定IPTV节目合并

on:
  schedule:
    - cron: '30 1,4 * * *'   # UTC 1:30 / 4:30 = 北京 9:30 / 12:30
    - cron: '50 9 * * *'     # UTC 9:50 = 北京 17:50
  workflow_dispatch:
    inputs:
      private_branch:
        description: '私库分支'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PRIVATE_REPO: '360vip/ittv'
      PRIVATE_BRANCH: ${{ github.event.inputs.private_branch || 'main' }}
      PRIVATE_SUBDIR: 'mytv'
      # ===== 需要从私库复制的目录（可自行增删，空格分隔）=====
      COPY_DIRS: 'data xuanze hebing tools'

    steps:
      # ========== 1. 检出当前仓库 ==========
      - name: 检出当前仓库 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========== 2. 从私库 mytv 目录复制指定目录的全部文件 ==========
      - name: 从私库复制指定目录 📦
        run: |
          set -e
          echo "开始克隆私有仓库 ${PRIVATE_REPO} (branch: ${PRIVATE_BRANCH}) ..."
          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/private-repo

          BASE="/tmp/private-repo/${PRIVATE_SUBDIR}"
          echo "私库子目录 ${PRIVATE_SUBDIR} 内容:"
          ls -la "${BASE}" || { echo "错误: 私库中不存在目录 ${PRIVATE_SUBDIR}"; exit 1; }

          for dir in ${COPY_DIRS}; do
            SRC="${BASE}/${dir}"
            if [ ! -d "${SRC}" ]; then
              echo "错误: 私库 ${PRIVATE_SUBDIR} 中不存在目录 ${dir}"
              exit 1
            fi
            echo "复制目录 ${PRIVATE_SUBDIR}/${dir} -> 工作区 ..."
            mkdir -p "${{ github.workspace }}/${dir}"
            cp -r "${SRC}/." "${{ github.workspace }}/${dir}/"
            echo "目录 ${dir} 内容:"
            ls -la "${{ github.workspace }}/${dir}"
          done

          rm -rf /tmp/private-repo
          echo "指定目录已全部复制到工作目录: ${COPY_DIRS}"

      # ========== 3. 清理旧数据 ==========
      - name: 清理旧数据 🗑️
        run: |
          for d in tv tem; do
            if [ -d "${{ github.workspace }}/$d" ]; then
              find "${{ github.workspace }}/$d" -name "*.txt" -type f -delete
              echo "已清理 $d 目录中的 txt 文件"
            fi
          done

      # ========== 4. 创建必要目录 ==========
      - name: 创建必要目录 🗂️
        run: |
          mkdir -p "${{ github.workspace }}/tv"
          mkdir -p "${{ github.workspace }}/data"
          echo "必要目录已创建"

      # ========== 5. 执行脚本 ==========
      - name: 执行合并我的电视节目频道 🌎
        run: python3 "${{ github.workspace }}/tools/iptv.py"

      # ========== 6. 把生成结果推回私库 mytv 目录 ==========
      - name: 推送结果到私库 🚀
        run: |
          set -e
          echo "开始推送到私有仓库 ${PRIVATE_REPO}/${PRIVATE_SUBDIR} (branch: ${PRIVATE_BRANCH}) ..."

          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/push-repo

          cd /tmp/push-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # 所有操作都在 mytv 子目录下进行
          mkdir -p "${PRIVATE_SUBDIR}"
          cd "${PRIVATE_SUBDIR}"

          # 需要保持"完全一致"的目录：先删干净再复制
          CLEAN_ITEMS="iptv output"
          # 需要复制的目录（含生成的 data，但不含 py，py 保留原样）
          COPY_ITEMS="iptv output"

          # 第一步：清空私库中需要完全一致的目录，避免残留旧文件
          for item in $CLEAN_ITEMS; do
            if [ -d "$item" ]; then
              echo "清空私库旧目录: ${PRIVATE_SUBDIR}/$item"
              rm -rf "$item"
            fi
          done

          # 第二步：复制最新内容进私库（不含 py，py 保留原样）
          for item in $COPY_ITEMS; do
            SRC="${{ github.workspace }}/$item"
            if [ -e "$SRC" ]; then
              cp -r "$SRC" "$item"
              echo "已复制 $item -> ${PRIVATE_SUBDIR}/$item"
            else
              echo "警告: $item 不存在，跳过"
            fi
          done

          # 回到仓库根目录再 add，保证路径相对仓库根
          cd /tmp/push-repo
          git add "${PRIVATE_SUBDIR}/"

          if git diff --cached --quiet; then
            echo "${PRIVATE_SUBDIR} 目录没有变更需要提交"
            cd /
            rm -rf /tmp/push-repo
            exit 0
          fi

          git commit -m "自动更新 ${PRIVATE_SUBDIR} 目录 - $(date '+%Y-%m-%d %H:%M:%S')"

          # 浅克隆下 rebase 可能因历史不足失败，先补全历史
          git fetch --unshallow origin "${PRIVATE_BRANCH}" || true

          if ! git pull --rebase origin "${PRIVATE_BRANCH}"; then
            echo "错误: git pull --rebase 失败，可能有冲突，终止推送"
            cd /
            rm -rf /tmp/push-repo
            exit 1
          fi

          if ! git push origin "${PRIVATE_BRANCH}"; then
            echo "错误: git push 失败"
            cd /
            rm -rf /tmp/push-repo
            exit 1
          fi

          echo "结果已成功推送到私库 ${PRIVATE_SUBDIR} 目录"
          cd /
          rm -rf /tmp/push-repo