name: 节目合并

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '分支'
        required: true
        default: 'main'
      private_branch:
        description: '私库分支'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PRIVATE_REPO: '360vip/ittv'
      PRIVATE_BRANCH: ${{ github.event.inputs.private_branch || 'main' }}

    steps:
      # ========== 1. 检出当前仓库 ==========
      - name: 检出当前仓库 📥
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ========== 2. Python 环境（官方 pip 缓存） ==========
      - name: 设置Python环境 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ========== 3. 安装依赖 ==========
      - name: 安装依赖 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========== 4. 从私库复制全部脚本和目录 ==========
      - name: 从私库复制全部文件 📦
        run: |
          set -e
          echo "开始克隆私有仓库 ${PRIVATE_REPO} (branch: ${PRIVATE_BRANCH}) ..."
          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/private-repo

          if [ ! -d "/tmp/private-repo/mytv" ]; then
            echo "错误: 私库中不存在 mytv 目录"
            exit 1
          fi

          echo "mytv 目录内容:"
          ls -la /tmp/private-repo/mytv

          cp -r /tmp/private-repo/mytv/. ${{ github.workspace }}/
          echo "mytv 全部文件已复制到工作目录"

          rm -rf /tmp/private-repo

      # ========== 5. 清理旧数据 ==========
      - name: 清理旧数据 🗑️
        run: |
          for d in tv tem; do
            if [ -d "${{ github.workspace }}/$d" ]; then
              find ${{ github.workspace }}/$d -name "*.txt" -type f -delete
              echo "已清理 $d 目录中的 txt 文件"
            fi
          done

      # ========== 6. 创建必要目录 ==========
      - name: 创建必要目录 🗂️
        run: |
          mkdir -p ${{ github.workspace }}/tv
          mkdir -p ${{ github.workspace }}/data
          echo "必要目录已创建"

      # ========== 7. 执行脚本 ==========
      - name: 执行检测域名组播电视节目频道 🌎
        run: python ${{ github.workspace }}/py/hebing.py

      # ========== 8. 把整个 mytv 目录推回私库 ==========
      - name: 推送 mytv 目录到私库 🚀
        run: |
          set -e
          echo "开始推送到私有仓库 ${PRIVATE_REPO}/mytv (branch: ${PRIVATE_BRANCH}) ..."

          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/push-repo

          cd /tmp/push-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # 确保 mytv 目录存在（不清空整体，保留 py 等未在清单中的目录）
          mkdir -p mytv

          # 需要保持"完全一致"的目录：先删干净再复制
          CLEAN_ITEMS="data fwip rtp zbvv tem vv"
          # 需要复制的目录：包含 data，但不包含 py
          COPY_ITEMS="data fwip rtp zbvv tem vv"

          # 第一步：清空私库中需要完全一致的目录，避免残留旧文件
          for item in $CLEAN_ITEMS; do
            if [ -d "mytv/$item" ]; then
              echo "清空私库旧目录: mytv/$item"
              rm -rf "mytv/$item"
            fi
          done

          # 第二步：复制最新内容进私库（不含 py，py 保留原样）
          for item in $COPY_ITEMS; do
            SRC="${{ github.workspace }}/$item"
            if [ -e "$SRC" ]; then
              cp -r "$SRC" "mytv/$item"
              echo "已复制 $item -> mytv/$item"
            else
              echo "警告: $item 不存在，跳过"
            fi
          done

          git add mytv/

          if git diff --cached --quiet; then
            echo "mytv 目录没有变更需要提交"
            cd /
            rm -rf /tmp/push-repo
            exit 0
          fi

          git commit -m "自动更新 mytv 目录 - $(date '+%Y-%m-%d %H:%M:%S')"

          if ! git pull --rebase origin "${PRIVATE_BRANCH}"; then
            echo "错误: git pull --rebase 失败，可能有冲突，终止推送"
            cd /
            rm -rf /tmp/push-repo
            exit 1
          fi

          if ! git push origin "${PRIVATE_BRANCH}"; then
            echo "错误: git push 失败"
            cd /
            rm -rf /tmp/push-repo
            exit 1
          fi

          echo "mytv 目录已成功推送到私库"
          cd /
          rm -rf /tmp/push-repo